version: '3.8'

services:
  bot:
    build: .
    container_name: telegram-bot-aiogram
    environment:
      - BOT_TOKEN=\
      - DATABASE_URL=\
      - REDIS_URL=\
      - WEBHOOK_URL=\
      - LOG_LEVEL=\
    volumes:
      - ./data:/app/data
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: telegram-bot-aiogram-redis
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data: