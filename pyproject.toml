[build-system]
requires = [\"setuptools>=68.0\", \"wheel\"]
build-backend = \"setuptools.build_meta\"

[project]
name = \"telegram-bot-aiogram\"
version = \"0.1.0\"
description = \"Async Telegram bot with aiogram 3.x, FSM, middleware, .env config\"
readme = \"README.md\"
requires-python = \">=3.11\"
dependencies = [
    \"aiogram==3.13.1\",
    \"aiosqlite==0.20.0\",
    \"redis==5.0.1\",
    \"pydantic==2.8.2\",
    \"pydantic-settings==2.3.4\",
    \"python-dotenv==1.0.1\",
    \"httpx==0.27.0\",
    \"loguru==0.7.2\",
]

[project.optional-dependencies]
dev = [
    \"pytest==8.3.2\",
    \"pytest-asyncio==0.23.7\",
    \"pytest-mock==3.14.0\",
    \"ruff==0.5.7\",
    \"mypy==1.11.1\",
]

[tool.pytest.ini_options]
asyncio_mode = \"auto\"
testpaths = [\"tests\"]

[tool.ruff]
line-length = 100
target-version = \"py311\"

[tool.mypy]
python_version = \"3.11\"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true